name: DPRO CHOSASHI Product Ready R3 Evidence Final Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3-EVIDENCE-FINAL.yml'

permissions:
  contents: write

jobs:
  r3-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R2 source lock
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5f231f116ac52796757b60f9b09ac092216bac4d HEAD
          grep -F 'CHOSASHI-R2-FRONTEND-PRODUCT-READY-20260824' config.js
          grep -F 'chosashi-product-ready' config.js
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fresh runtime and DEMO PREPARE proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/chosashi-r3
          GW='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/chosashi-product-ready'
          LEGACY='https://dpro-chosashi-line-api.dpromstk2000.workers.dev'
          OFFICE='dpro_chosashi_demo'

          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/health.json -w '%{http_code}' "${GW}/health?office_code=${OFFICE}&r3=${GITHUB_RUN_ID}")"
          test "$code" = "200"
          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/check.json -w '%{http_code}' "${GW}/product-ready/check?office_code=${OFFICE}&r3=${GITHUB_RUN_ID}")"
          test "$code" = "200"
          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/self.json -w '%{http_code}' \
            -H 'content-type: application/json' -H 'x-demo-mode: 1' -H 'x-product-ready-code: 1234' \
            -d '{"office_code":"dpro_chosashi_demo","demo_mode":true}' \
            "${GW}/product-ready/self-test?office_code=${OFFICE}&demo=1")"
          test "$code" = "200"

          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          c=json.load(open('/tmp/check.json'))
          s=json.load(open('/tmp/self.json'))
          assert h.get('ok') is True
          assert h.get('version') == 'CHOSASHI-R2-ADAPTER-PRODUCT-READY-20260824'
          assert h.get('versionsAligned') is True
          assert c.get('ok') is True
          assert c.get('check',{}).get('versionsAligned') is True
          assert s.get('ok') is True
          assert s.get('self_test',{}).get('all') is True
          PY

          # DEMO PREPARE must be repeatable in the explicit demo office.
          for n in 1 2; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o "/tmp/demo-${n}.json" -w '%{http_code}' \
              -X POST -H 'content-type: application/json' -H 'X-Admin-Key: 1234' \
              -d '{"office_code":"dpro_chosashi_demo"}' \
              "${LEGACY}/api/admin/demo-prepare?office_code=${OFFICE}")"
            test "$code" = "200"
            python - "$n" <<'PY'
          import json,sys
          d=json.load(open('/tmp/demo-'+sys.argv[1]+'.json'))
          assert d.get('ok') is True
          PY
          done

          # Same demo credential must never prepare a non-demo/unknown production target.
          code="$(curl -sS -o /tmp/demo-prod-negative.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' -H 'X-Admin-Key: 1234' \
            -d '{"office_code":"production_probe"}' \
            "${LEGACY}/api/admin/demo-prepare?office_code=production_probe")"
          test "$code" != "200"

          cp /tmp/health.json product-ready-evidence/chosashi-r3/health.json
          cp /tmp/check.json product-ready-evidence/chosashi-r3/product-ready-check.json
          cp /tmp/self.json product-ready-evidence/chosashi-r3/self-test.json
          cp /tmp/demo-1.json product-ready-evidence/chosashi-r3/demo-prepare-1.json
          cp /tmp/demo-2.json product-ready-evidence/chosashi-r3/demo-prepare-2.json
          cp /tmp/demo-prod-negative.json product-ready-evidence/chosashi-r3/demo-prepare-production-negative.json

      - name: Fresh public URL set
        shell: bash
        run: |
          set -euo pipefail
          APP='https://dpromstk2000-lab.github.io/dpro-chosashi-line-liff'
          SITE='https://dpromstk2000-lab.github.io/dpro-line-systems-site'
          for path in 'index.html?demo=1' 'member.html?demo=1' 'owner.html?demo=1' 'owner-ipad.html?demo=1' 'system-check.html?demo=1'; do
            code="$(curl -L -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "${APP}/${path}&r3=${GITHUB_RUN_ID}")"
            test "$code" = "200"
          done
          curl -L -fsS "${SITE}/systems/chosashi.html?r3=${GITHUB_RUN_ID}" -o /tmp/product.html
          curl -L -fsS "${SITE}/systems-data.js?r3=${GITHUB_RUN_ID}" -o /tmp/systems-data.js || true
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/product.html').read_text(errors='ignore') + Path('/tmp/systems-data.js').read_text(errors='ignore')
          assert 'dpro-chosashi-line-liff' in text
          assert 'index.html?demo=1' in text
          PY
          cp /tmp/product.html product-ready-evidence/chosashi-r3/product-site.html
          cp /tmp/systems-data.js product-ready-evidence/chosashi-r3/systems-data.js || true

          # Official site is nonblocking: record current status without failing FINAL gate.
          curl -L -sS -o /dev/null -w '%{http_code}\n' 'https://dpro-shop.com/systems/chosashi' \
            > product-ready-evidence/chosashi-r3/official-site-http.txt || echo 000 > product-ready-evidence/chosashi-r3/official-site-http.txt

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chosashi-r3
          cd /tmp/chosashi-r3
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh Chromium matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/chosashi-r3/screenshots
          cat > /tmp/chosashi-r3/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const BASE='https://dpromstk2000-lab.github.io/dpro-chosashi-line-liff/';
          const cases=[
            {key:'pc1440-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'mobile390-index',file:'index.html?demo=1',width:390,height:844},
            {key:'mobile320-member',file:'member.html?demo=1',width:320,height:720},
            {key:'ipad1024-owner',file:'owner-ipad.html?demo=1',width:1024,height:768},
            {key:'live-demo',file:'index.html?demo=1',width:1440,height:1000},
            {key:'system-check',file:'system-check.html?demo=1',width:1440,height:1000}
          ];
          const blocking=/(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;
          const technical=/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;
          const browser=await chromium.launch({headless:true});
          const results=[]; let failed=false;
          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage(), pageErrors=[], consoleErrors=[], httpErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()})});
            let status=0,navigationError='';
            try{const r=await page.goto(BASE+c.file+(c.file.includes('?')?'&':'?')+'r3='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});status=r?.status()||0;await page.waitForTimeout(3000)}catch(e){navigationError=String(e)}
            const metrics=navigationError?null:await page.evaluate(()=>({innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),text:(document.body?.innerText||'').slice(0,250000)}));
            const overflow=metrics?metrics.scrollWidth>metrics.innerWidth+1:true;
            const blockingConsoleErrors=consoleErrors.filter(x=>blocking.test(x));
            const criticalResourceErrors=httpErrors.filter(x=>['document','script','stylesheet'].includes(x.resourceType));
            const technicalExposure=metrics?technical.test(metrics.text):true;
            const rec={...c,httpStatus:status,navigationError,overflow,innerWidth:metrics?.innerWidth??0,scrollWidth:metrics?.scrollWidth??0,pageErrors,consoleErrors,blockingConsoleErrors,httpErrors,criticalResourceErrors,technicalExposure};
            rec.ok=!navigationError&&status===200&&!overflow&&pageErrors.length===0&&blockingConsoleErrors.length===0&&criticalResourceErrors.length===0&&!technicalExposure;
            if(!rec.ok)failed=true; results.push(rec);
            if(!navigationError)await page.screenshot({path:`product-ready-evidence/chosashi-r3/screenshots/${c.key}.png`,fullPage:true});
            await ctx.close();
          }
          await browser.close();
          const out={ok:!failed,checkedAt:new Date().toISOString(),sourceHead:process.env.SOURCE_HEAD||null,total:results.length,passed:results.filter(x=>x.ok).length,failed:results.filter(x=>!x.ok).length,results};
          fs.writeFileSync('product-ready-evidence/chosashi-r3/browser-final.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({ok:out.ok,total:out.total,passed:out.passed,failed:out.failed},null,2));
          process.exit(out.ok?0:2);
          EOF
          node /tmp/chosashi-r3/qa.mjs

      - name: Build final evidence
        shell: python
        run: |
          import json,datetime,os,pathlib
          p=pathlib.Path('product-ready-evidence/chosashi-r3')
          b=json.loads((p/'browser-final.json').read_text())
          out={'ok':b.get('ok') is True,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'sourceHead':os.getenv('SOURCE_HEAD'),'closesReadyItems':['READY-018','READY-019','READY-020','READY-021','READY-026','READY-028','READY-033'],
               'nonblockingReady030':'recorded_only','finalLockSelfConfirmed':False}
          (p/'final.json').write_text(json.dumps(out,indent=2)+'\n')
          assert out['ok']

      - name: Commit evidence and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-ready-evidence/chosashi-r3
          git commit -m "Publish CHOSASHI R3 Product READY evidence"
          git pull --rebase
          git push
          git pull --rebase
          git rm -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3-EVIDENCE-FINAL.yml
          git commit -m "Complete CHOSASHI Product READY R3 final gate"
          git push
