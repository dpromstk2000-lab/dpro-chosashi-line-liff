name: DPRO CHOSASHI Product Ready R3.1 Evidence Final Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3.1-EVIDENCE-FINAL.yml'

permissions:
  contents: write

jobs:
  r31-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R2 source lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5f231f116ac52796757b60f9b09ac092216bac4d HEAD
          grep -F 'CHOSASHI-R2-FRONTEND-PRODUCT-READY-20260824' config.js
          grep -F 'chosashi-product-ready' config.js
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fresh Product READY runtime proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/chosashi-r31
          GW='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/chosashi-product-ready'
          OFFICE='dpro_chosashi_demo'

          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/health.json -w '%{http_code}' "${GW}/health?office_code=${OFFICE}&r31=${GITHUB_RUN_ID}")"
          echo "health_http=${code}"
          test "$code" = "200"

          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/check.json -w '%{http_code}' "${GW}/product-ready/check?office_code=${OFFICE}&r31=${GITHUB_RUN_ID}")"
          echo "check_http=${code}"
          test "$code" = "200"

          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/self.json -w '%{http_code}' \
            -H 'content-type: application/json' -H 'x-demo-mode: 1' -H 'x-product-ready-code: 1234' \
            -d '{"office_code":"dpro_chosashi_demo","demo_mode":true}' \
            "${GW}/product-ready/self-test?office_code=${OFFICE}&demo=1")"
          echo "self_test_http=${code}"
          test "$code" = "200"

          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          c=json.load(open('/tmp/check.json'))
          s=json.load(open('/tmp/self.json'))
          assert h.get('ok') is True
          assert h.get('version') == 'CHOSASHI-R2-ADAPTER-PRODUCT-READY-20260824'
          assert h.get('versionsAligned') is True
          assert c.get('ok') is True
          assert c.get('check',{}).get('versionsAligned') is True
          assert s.get('ok') is True
          assert s.get('self_test',{}).get('all') is True
          PY

          cp /tmp/health.json product-ready-evidence/chosashi-r31/health.json
          cp /tmp/check.json product-ready-evidence/chosashi-r31/product-ready-check.json
          cp /tmp/self.json product-ready-evidence/chosashi-r31/self-test.json

      - name: Fresh public URL proof
        shell: bash
        run: |
          set -euo pipefail
          APP='https://dpromstk2000-lab.github.io/dpro-chosashi-line-liff'
          SITE='https://dpromstk2000-lab.github.io/dpro-line-systems-site'

          for path in 'index.html?demo=1' 'member.html?demo=1' 'owner.html?demo=1' 'owner-ipad.html?demo=1' 'system-check.html?demo=1'; do
            code="$(curl -L -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "${APP}/${path}&r31=${GITHUB_RUN_ID}")"
            echo "${path} => ${code}"
            test "$code" = "200"
          done

          curl -L -fsS "${SITE}/systems/chosashi.html?r31=${GITHUB_RUN_ID}" -o /tmp/product.html
          curl -L -fsS "${SITE}/systems-data.js?r31=${GITHUB_RUN_ID}" -o /tmp/systems-data.js || true

          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/product.html').read_text(errors='ignore') + Path('/tmp/systems-data.js').read_text(errors='ignore')
          assert 'dpro-chosashi-line-liff' in text
          assert 'index.html?demo=1' in text
          PY

          cp /tmp/product.html product-ready-evidence/chosashi-r31/product-site.html
          cp /tmp/systems-data.js product-ready-evidence/chosashi-r31/systems-data.js || true
          curl -L -sS -o /dev/null -w '%{http_code}\n' 'https://dpro-shop.com/systems/chosashi' \
            > product-ready-evidence/chosashi-r31/official-site-http.txt || echo 000 > product-ready-evidence/chosashi-r31/official-site-http.txt

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chosashi-r31
          cd /tmp/chosashi-r31
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh Chromium and browser-origin DEMO PREPARE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/chosashi-r31/screenshots

          cat > /tmp/chosashi-r31/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-chosashi-line-liff/';
          const cases=[
            {key:'pc1440-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'mobile390-index',file:'index.html?demo=1',width:390,height:844},
            {key:'mobile320-member',file:'member.html?demo=1',width:320,height:720},
            {key:'ipad1024-owner',file:'owner-ipad.html?demo=1',width:1024,height:768},
            {key:'live-demo',file:'index.html?demo=1',width:1440,height:1000},
            {key:'system-check',file:'system-check.html?demo=1',width:1440,height:1000}
          ];

          const blocking=/(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute|blocked by CORS|CORS policy|net::ERR_|Failed to load resource)/i;
          const technical=/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;
          const browser=await chromium.launch({headless:true});
          const results=[];
          let failed=false;

          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            const pageErrors=[],consoleErrors=[],httpErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()})});

            let status=0,navigationError='';
            try{
              const r=await page.goto(BASE+c.file+(c.file.includes('?')?'&':'?')+'r31='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              status=r?.status()||0;
              await page.waitForTimeout(3500);
            }catch(e){navigationError=String(e)}

            const metrics=navigationError?null:await page.evaluate(()=>({
              innerWidth,
              scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),
              text:(document.body?.innerText||'').slice(0,250000)
            }));

            const overflow=metrics?metrics.scrollWidth>metrics.innerWidth+1:true;
            const blockingConsoleErrors=consoleErrors.filter(x=>blocking.test(x));
            const criticalResourceErrors=httpErrors.filter(x=>['document','script','stylesheet'].includes(x.resourceType));
            const technicalExposure=metrics?technical.test(metrics.text):true;

            const rec={...c,httpStatus:status,navigationError,overflow,
              innerWidth:metrics?.innerWidth??0,scrollWidth:metrics?.scrollWidth??0,
              pageErrors,consoleErrors,blockingConsoleErrors,httpErrors,criticalResourceErrors,technicalExposure};
            rec.ok=!navigationError&&status===200&&!overflow&&pageErrors.length===0&&blockingConsoleErrors.length===0&&criticalResourceErrors.length===0&&!technicalExposure;
            if(!rec.ok)failed=true;
            results.push(rec);

            if(!navigationError){
              await page.screenshot({path:`product-ready-evidence/chosashi-r31/screenshots/${c.key}.png`,fullPage:true});
            }
            await ctx.close();
          }

          // READY-026: execute DEMO PREPARE from the same GitHub Pages browser Origin as the real screen.
          const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await ctx.newPage();
          await page.goto(BASE+'system-check.html?demo=1&r31-proof='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(1500);

          const demoPrepare=await page.evaluate(async()=>{
            const cfg=window.DPRO_CONFIG;
            if(!cfg?.apiBase) return {ok:false,error:'DPRO_CONFIG.apiBase missing'};

            async function call(officeCode){
              const url=new URL(`${cfg.apiBase}/api/admin/demo-prepare`);
              url.searchParams.set('office_code',officeCode);
              const res=await fetch(url,{
                method:'POST',
                headers:{'Content-Type':'application/json','X-Admin-Key':'1234'},
                body:JSON.stringify({office_code:officeCode}),
                cache:'no-store'
              });
              const text=await res.text();
              let data=null;
              try{data=text?JSON.parse(text):null}catch{data={raw:text.slice(0,2000)}}
              return {status:res.status,ok:res.ok,data};
            }

            const first=await call('dpro_chosashi_demo');
            const second=await call('dpro_chosashi_demo');
            const productionNegative=await call('production_probe');
            return {
              ok:first.status===200&&first.data?.ok===true&&second.status===200&&second.data?.ok===true&&productionNegative.status!==200&&productionNegative.data?.ok!==true,
              first,second,productionNegative
            };
          });

          fs.writeFileSync('product-ready-evidence/chosashi-r31/demo-prepare-browser-origin.json',JSON.stringify(demoPrepare,null,2)+'\n');
          if(!demoPrepare.ok) failed=true;
          await ctx.close();
          await browser.close();

          const out={
            ok:!failed,
            checkedAt:new Date().toISOString(),
            sourceHead:process.env.SOURCE_HEAD||null,
            total:results.length,
            passed:results.filter(x=>x.ok).length,
            failed:results.filter(x=>!x.ok).length,
            demoPrepareBrowserOrigin:demoPrepare.ok,
            results
          };
          fs.writeFileSync('product-ready-evidence/chosashi-r31/browser-final.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({ok:out.ok,total:out.total,passed:out.passed,failed:out.failed,demoPrepareBrowserOrigin:out.demoPrepareBrowserOrigin},null,2));
          process.exit(out.ok?0:2);
          EOF

          node /tmp/chosashi-r31/qa.mjs

      - name: Build final evidence
        shell: python
        run: |
          import json,datetime,os,pathlib
          p=pathlib.Path('product-ready-evidence/chosashi-r31')
          b=json.loads((p/'browser-final.json').read_text())
          d=json.loads((p/'demo-prepare-browser-origin.json').read_text())
          out={
            'ok': b.get('ok') is True and d.get('ok') is True,
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'sourceHead':os.getenv('SOURCE_HEAD'),
            'closesReadyItems':['READY-018','READY-019','READY-020','READY-021','READY-026','READY-028','READY-033'],
            'r3FailedRun':32718547441,
            'r31Repair':'browser-origin-demo-prepare',
            'finalLockSelfConfirmed':False
          }
          (p/'final.json').write_text(json.dumps(out,indent=2)+'\n')
          assert out['ok']

      - name: Commit evidence and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-ready-evidence/chosashi-r31
          git commit -m "Publish CHOSASHI R3.1 Product READY evidence"
          git pull --rebase
          git push
          git pull --rebase
          git rm -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3.1-EVIDENCE-FINAL.yml
          if [ -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3-EVIDENCE-FINAL.yml ]; then
            git rm -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3-EVIDENCE-FINAL.yml
          fi
          git commit -m "Complete CHOSASHI Product READY R3.1 final gate"
          git push
