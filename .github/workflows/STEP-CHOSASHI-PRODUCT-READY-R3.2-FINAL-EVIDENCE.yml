name: DPRO CHOSASHI Product Ready R3.2 Final Evidence Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3.2-FINAL-EVIDENCE.yml'

permissions:
  contents: write

jobs:
  r32-final:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R2 source lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5f231f116ac52796757b60f9b09ac092216bac4d HEAD
          grep -F 'CHOSASHI-R2-FRONTEND-PRODUCT-READY-20260824' config.js
          grep -F 'SERVICE_BINDING_REQUIRED' config.js
          grep -F 'if (isDemo()) return nativeFetch(input, init);' config.js
          grep -F 'chosashi-product-ready' config.js
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fresh runtime proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/chosashi-r32
          GW='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/chosashi-product-ready'
          OFFICE='dpro_chosashi_demo'

          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/health.json -w '%{http_code}' "${GW}/health?office_code=${OFFICE}&r32=${GITHUB_RUN_ID}")"
          test "$code" = "200"
          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/check.json -w '%{http_code}' "${GW}/product-ready/check?office_code=${OFFICE}&r32=${GITHUB_RUN_ID}")"
          test "$code" = "200"
          code="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/self.json -w '%{http_code}' \
            -H 'content-type: application/json' -H 'x-demo-mode: 1' -H 'x-product-ready-code: 1234' \
            -d '{"office_code":"dpro_chosashi_demo","demo_mode":true}' \
            "${GW}/product-ready/self-test?office_code=${OFFICE}&demo=1")"
          test "$code" = "200"

          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          c=json.load(open('/tmp/check.json'))
          s=json.load(open('/tmp/self.json'))
          assert h.get('ok') is True
          assert h.get('version') == 'CHOSASHI-R2-ADAPTER-PRODUCT-READY-20260824'
          assert h.get('versionsAligned') is True
          assert c.get('ok') is True
          assert c.get('check',{}).get('versionsAligned') is True
          assert s.get('ok') is True
          assert s.get('self_test',{}).get('all') is True
          PY

          cp /tmp/health.json product-ready-evidence/chosashi-r32/health.json
          cp /tmp/check.json product-ready-evidence/chosashi-r32/product-ready-check.json
          cp /tmp/self.json product-ready-evidence/chosashi-r32/self-test.json

      - name: Fresh public URL proof
        shell: bash
        run: |
          set -euo pipefail
          APP='https://dpromstk2000-lab.github.io/dpro-chosashi-line-liff'
          SITE='https://dpromstk2000-lab.github.io/dpro-line-systems-site'

          for path in 'index.html?demo=1' 'member.html?demo=1' 'owner.html?demo=1' 'owner-ipad.html?demo=1' 'system-check.html?demo=1'; do
            code="$(curl -L -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "${APP}/${path}&r32=${GITHUB_RUN_ID}")"
            test "$code" = "200"
          done

          curl -L -fsS "${SITE}/systems/chosashi.html?r32=${GITHUB_RUN_ID}" -o /tmp/product.html
          curl -L -fsS "${SITE}/systems-data.js?r32=${GITHUB_RUN_ID}" -o /tmp/systems-data.js || true

          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/product.html').read_text(errors='ignore')+Path('/tmp/systems-data.js').read_text(errors='ignore')
          assert 'dpro-chosashi-line-liff' in text
          assert 'index.html?demo=1' in text
          PY

          cp /tmp/product.html product-ready-evidence/chosashi-r32/product-site.html
          cp /tmp/systems-data.js product-ready-evidence/chosashi-r32/systems-data.js || true
          curl -L -sS -o /dev/null -w '%{http_code}\n' 'https://dpro-shop.com/systems/chosashi' \
            > product-ready-evidence/chosashi-r32/official-site-http.txt || echo 000 > product-ready-evidence/chosashi-r32/official-site-http.txt

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chosashi-r32
          cd /tmp/chosashi-r32
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh Chromium and correct DEMO PREPARE guard proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/chosashi-r32/screenshots

          cat > /tmp/chosashi-r32/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-chosashi-line-liff/';
          const cases=[
            {key:'pc1440-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'mobile390-index',file:'index.html?demo=1',width:390,height:844},
            {key:'mobile320-member',file:'member.html?demo=1',width:320,height:720},
            {key:'ipad1024-owner',file:'owner-ipad.html?demo=1',width:1024,height:768},
            {key:'live-demo',file:'index.html?demo=1',width:1440,height:1000},
            {key:'system-check',file:'system-check.html?demo=1',width:1440,height:1000}
          ];

          const blocking=/(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute|blocked by CORS|CORS policy|net::ERR_|Failed to load resource)/i;
          const technical=/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;
          const browser=await chromium.launch({headless:true});
          const results=[];
          let failed=false;

          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            const pageErrors=[],consoleErrors=[],httpErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()})});

            let status=0,navigationError='';
            try{
              const r=await page.goto(BASE+c.file+(c.file.includes('?')?'&':'?')+'r32='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              status=r?.status()||0;
              await page.waitForTimeout(3500);
            }catch(e){navigationError=String(e)}

            const metrics=navigationError?null:await page.evaluate(()=>({
              innerWidth,
              scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),
              text:(document.body?.innerText||'').slice(0,250000)
            }));
            const overflow=metrics?metrics.scrollWidth>metrics.innerWidth+1:true;
            const blockingConsoleErrors=consoleErrors.filter(x=>blocking.test(x));
            const criticalResourceErrors=httpErrors.filter(x=>['document','script','stylesheet'].includes(x.resourceType));
            const technicalExposure=metrics?technical.test(metrics.text):true;
            const rec={...c,httpStatus:status,navigationError,overflow,
              innerWidth:metrics?.innerWidth??0,scrollWidth:metrics?.scrollWidth??0,
              pageErrors,consoleErrors,blockingConsoleErrors,httpErrors,criticalResourceErrors,technicalExposure};
            rec.ok=!navigationError&&status===200&&!overflow&&pageErrors.length===0&&blockingConsoleErrors.length===0&&criticalResourceErrors.length===0&&!technicalExposure;
            if(!rec.ok) failed=true;
            results.push(rec);
            if(!navigationError) await page.screenshot({path:`product-ready-evidence/chosashi-r32/screenshots/${c.key}.png`,fullPage:true});
            await ctx.close();
          }

          // Explicit DEMO mode: legacy Worker is intentionally allowed.
          const demoCtx=await browser.newContext({viewport:{width:1440,height:1000}});
          const demoPage=await demoCtx.newPage();
          await demoPage.goto(BASE+'system-check.html?demo=1&r32-demo='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await demoPage.waitForTimeout(1500);

          const demoPrepare=await demoPage.evaluate(async()=>{
            const cfg=window.DPRO_CONFIG;
            async function call(){
              const url=new URL(`${cfg.apiBase}/api/admin/demo-prepare`);
              url.searchParams.set('office_code',cfg.officeCode);
              const res=await fetch(url,{
                method:'POST',
                headers:{'Content-Type':'application/json','X-Admin-Key':'1234'},
                body:JSON.stringify({office_code:cfg.officeCode}),
                cache:'no-store'
              });
              const text=await res.text();
              let data=null; try{data=text?JSON.parse(text):null}catch{data={raw:text.slice(0,2000)}}
              return {status:res.status,ok:res.ok,data};
            }
            const first=await call();
            const second=await call();
            return {
              ok:first.status===200&&first.data?.ok===true&&second.status===200&&second.data?.ok===true,
              first,second
            };
          });
          await demoCtx.close();

          // Production/contract mode: config.js must fail closed BEFORE legacy Worker use.
          const prodCtx=await browser.newContext({viewport:{width:1440,height:1000}});
          const prodPage=await prodCtx.newPage();
          await prodPage.goto(BASE+'system-check.html?r32-prod='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await prodPage.waitForTimeout(1000);

          const productionGuard=await prodPage.evaluate(async()=>{
            const cfg=window.DPRO_CONFIG;
            const url=new URL(`${cfg.apiBase}/api/admin/demo-prepare`);
            url.searchParams.set('office_code',cfg.officeCode);
            const res=await fetch(url,{
              method:'POST',
              headers:{'Content-Type':'application/json','X-Admin-Key':'1234'},
              body:JSON.stringify({office_code:cfg.officeCode}),
              cache:'no-store'
            });
            const text=await res.text();
            let data=null; try{data=text?JSON.parse(text):null}catch{data={raw:text.slice(0,2000)}}
            return {
              status:res.status,
              ok:res.ok,
              data,
              guarded:res.status===503&&data?.ok===false&&data?.code==='SERVICE_BINDING_REQUIRED'
            };
          });
          await prodCtx.close();

          fs.writeFileSync('product-ready-evidence/chosashi-r32/demo-prepare.json',JSON.stringify(demoPrepare,null,2)+'\n');
          fs.writeFileSync('product-ready-evidence/chosashi-r32/production-legacy-guard.json',JSON.stringify(productionGuard,null,2)+'\n');

          if(!demoPrepare.ok||!productionGuard.guarded) failed=true;
          await browser.close();

          const out={
            ok:!failed,
            checkedAt:new Date().toISOString(),
            sourceHead:process.env.SOURCE_HEAD||null,
            total:results.length,
            passed:results.filter(x=>x.ok).length,
            failed:results.filter(x=>!x.ok).length,
            demoPrepareTwice:demoPrepare.ok,
            productionLegacyGuard:productionGuard.guarded,
            results
          };
          fs.writeFileSync('product-ready-evidence/chosashi-r32/browser-final.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({
            ok:out.ok,total:out.total,passed:out.passed,failed:out.failed,
            demoPrepareTwice:out.demoPrepareTwice,
            productionLegacyGuard:out.productionLegacyGuard,
            productionGuardStatus:productionGuard.status,
            productionGuardCode:productionGuard.data?.code
          },null,2));
          process.exit(out.ok?0:2);
          EOF

          node /tmp/chosashi-r32/qa.mjs

      - name: Build final evidence
        shell: python
        run: |
          import json,datetime,os,pathlib
          p=pathlib.Path('product-ready-evidence/chosashi-r32')
          b=json.loads((p/'browser-final.json').read_text())
          d=json.loads((p/'demo-prepare.json').read_text())
          g=json.loads((p/'production-legacy-guard.json').read_text())
          out={
            'ok':b.get('ok') is True and d.get('ok') is True and g.get('guarded') is True,
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'sourceHead':os.getenv('SOURCE_HEAD'),
            'closesReadyItems':['READY-018','READY-019','READY-020','READY-021','READY-026','READY-028','READY-033'],
            'priorFailedRuns':[32718547441,32720053778],
            'finalCorrection':'explicit-demo repeat + non-demo SERVICE_BINDING_REQUIRED frontend guard',
            'finalLockSelfConfirmed':False
          }
          (p/'final.json').write_text(json.dumps(out,indent=2)+'\n')
          assert out['ok']

      - name: Commit evidence and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git add product-ready-evidence/chosashi-r32
          git commit -m "Publish CHOSASHI R3.2 Product READY final evidence"
          git pull --rebase
          git push

          git pull --rebase
          git rm -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3.2-FINAL-EVIDENCE.yml
          [ ! -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3.1-EVIDENCE-FINAL.yml ] || git rm -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3.1-EVIDENCE-FINAL.yml
          [ ! -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3-EVIDENCE-FINAL.yml ] || git rm -f .github/workflows/STEP-CHOSASHI-PRODUCT-READY-R3-EVIDENCE-FINAL.yml
          git commit -m "Complete CHOSASHI Product READY R3.2 final gate"
          git push
